[versions]
agp = "8.9.1"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
hilt = "2.52"
hiltNavigationCompose = "1.2.0"
composeBom = "2024.12.01"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
navigationCompose = "2.8.5"
room = "2.6.1"
datastore = "1.1.1"
okhttp = "4.12.0"
serialization = "1.7.3"
coil = "3.0.4"
securityCrypto = "1.1.0-alpha06"
media3 = "1.5.0"
# Kokoro is an ONNX graph, not a GGUF, so it needs a second runtime. The AAR
# carries prebuilt .so files for every ABI this app ships.
#
# 1.28, and the reason is OmniVoice. Both of its exports were refused by 1.22,
# for two unrelated schema reasons, and both are fixed in releases that already
# exist:
#
#   int4  needs com.microsoft.GatherBlockQuantized to take a `bits` attribute.
#         1.22 has no such attribute and rejects the graph outright with
#         ORT_INVALID_GRAPH ... Unrecognized attribute: bits.
#   root  feeds com.microsoft.GroupQueryAttention twelve inputs — Qwen3 puts its
#         QK-norm tensors there — where 1.22's schema allows seven to eleven.
#
# Reading the tagged ContribOperators.md for each release: 1.23 is the first
# with both (`bits` present, GQA 7-12), 1.25 widens GQA to 7-14, 1.28 to 7-16.
# 1.24 was never published as an Android AAR; 1.28 is the newest that was.
#
# I had this backwards for a while and said so in commit 6e24e12 — that the
# input range had *grown* from 7-11 to 7-16 and therefore no runtime would take
# twelve. It grew the right way. Everything between 1.22 and main was releases I
# had not looked at.
onnxruntime = "1.28.0"
# The proxy's HTTP server (SPEC 18). CIO is the pure-Kotlin engine — no Netty,
# no Java NIO server stack, and it is coroutine-native, which is what lets a
# request handler collect an engine Flow straight onto the wire. 3.0.3 is the
# last release built against Kotlin 2.0.21, which is what this project is on.
ktor = "3.0.3"
junit = "4.13.2"
androidxJunit = "1.2.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }

# Only these two. Content negotiation, CORS and SSE are all deliberately not
# used: the proxy writes exact wire bytes (Anthropic needs named `event:` lines)
# and its CORS list is user-editable at runtime, which an install-time plugin
# cannot express.
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
